    label: Research Scientist
    title_synonyms: [research scientist, ai research scientist, ml research scientist, member of technical staff research]
    signals: {publications_expected: true, production_systems: false, infra_depth: low, customer_facing: false}
    typical_background: Ph.D. typical; publications at top venues.
    qualifying_degree_fields: *cs_ai_degrees
  research_engineer:
