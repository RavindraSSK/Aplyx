# Vertical config: AI-related role families for a US-based M.S./Ph.D. candidate
# in AI / CS. Every band is IN SCOPE; bands exist so the user can widen or
# narrow with a filter. The engine (app/) never hardcodes any of these names.
#
# Each family: title_synonyms (matched against posting titles), signals
# (distinguishing characteristics used by the classifier), typical_background,
# qualifying_degree_fields (degree fields that plausibly qualify).

vertical: ai
version: 1

bands:
  core_ai_ml:
    label: Core AI/ML
    description: The job is building AI/ML systems.
    default_ai_relevance: core
  ai_adjacent_engineering:
    label: AI-adjacent engineering
    description: Engineering serving AI/ML systems or products.
    default_ai_relevance: applied
  data_and_analytics:
    label: Data and analytics
    description: Data science, analytics and quantitative roles.
    default_ai_relevance: applied
  technical_non_coding:
    label: Technical AI roles (non-core coding)
    description: Technical roles in the AI industry that are not primarily coding.
    default_ai_relevance: applied

degree_fields: &cs_ai_degrees
  - artificial intelligence
  - computer science
  - machine learning
  - data science
  - computer engineering
  - electrical engineering
  - statistics
  - applied mathematics
  - robotics
  - computational linguistics

families:
  # ── Core AI/ML ───────────────────────────────────────────────────────────
  ml_engineer:
    band: core_ai_ml
    label: Machine Learning Engineer
    title_synonyms: [machine learning engineer, ml engineer, mle, ai engineer, machine learning software engineer]
    signals: {publications_expected: false, production_systems: true, infra_depth: medium, customer_facing: false}
    typical_background: M.S. in AI/CS with ML projects; Python, PyTorch/TensorFlow, model serving.
    qualifying_degree_fields: *cs_ai_degrees
  applied_scientist:
    band: core_ai_ml
    label: Applied Scientist
    title_synonyms: [applied scientist, applied ml scientist, applied research scientist, machine learning scientist]
    signals: {publications_expected: sometimes, production_systems: true, infra_depth: low, customer_facing: false}
    typical_background: M.S./Ph.D.; experiment design, modeling, shipping models to product.
    qualifying_degree_fields: *cs_ai_degrees
  research_scientist:
