ai_relevance_levels:
  core: The job is building AI/ML systems.
  applied: Engineering or data work directly serving AI/ML systems or products.
  adjacent: General software/data role at an AI company, or AI is one part of the job.
  incidental: AI is a buzzword in the posting; the work isn't AI.

dashboard_default_ai_relevance: [core, applied, adjacent]
