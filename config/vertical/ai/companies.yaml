# Seed list: US employers that hire AI/CS Master's graduates into AI-related
# roles. Loaded into the `companies` table by `python -m app.cli companies seed`
# (idempotent: matches on slug, never overwrites your manual edits/tier_override).
#
# ats: greenhouse | lever | ashby | smartrecruiters | workday
# ats_slug: the public board identifier. Workday: "tenant.wdN/SiteName".
# tier_seed: 1 = big tech / large-cap public / major AI lab / top private valuation
#            2 = ~500-10k headcount, well-funded private, research institutions
#            3 = startups <500, unknown
# headcount_band: "<500" | "500-10k" | "10k+"
#
# HONESTY NOTE: board slugs are best-known values and are NOT verified until the
# first ingestion run succeeds (companies.verified / last_fetch_status). Run
# `python -m app.cli companies verify` to check every board; fix or add boards
# with `python -m app.cli companies add <careers-url>` (auto-detects the ATS).

