# Companies now live in the database (seeded from config/vertical/<v>/companies.yaml,
# managed with `python -m app.cli companies ...`). This file only holds matching rules.

# Rule filters applied during matching (all optional).
matching:
  # Title must contain at least one of these (case-insensitive).
  # Leave EMPTY to accept any title synonym from config/vertical/<vertical>/role_families.yaml
  # (every AI-related role family) - recommended.
  required_title_keywords: []
  # Any of these in the title or description disqualifies the job (score 0):
  excluded_keywords:
    - "10+ years"
    - "8+ years"
    - clearance
    - staff engineer
    - principal
    - director
  # Allowed locations (substring match). Remote jobs always pass.
  # Leave EMPTY for all locations (US-wide search):
  locations: []
  # If true, the description must mention visa sponsorship:
  must_mention_sponsorship: false
