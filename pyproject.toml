[project]
name = "jobagent"
version = "0.1.0"
description = "Personal AI job-application agent: discover, match, tailor, track."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "anthropic>=0.34",
    "pyyaml>=6.0",
    "psycopg2-binary>=2.9; platform_system != 'Darwin' or platform_machine != 'arm64'",
]

[project.optional-dependencies]
ml = [
    "sentence-transformers>=2.7",
]
apply = [
    "playwright>=1.44",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
